<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Loaf Dog</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b001a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 600 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);
let player;
let platforms;
let cursors;
let itemsGroup; 
let janitorsGroup;
let score = 0;
let scoreText;

let isMovingLeft = false;
let isMovingRight = false;

function preload() {}

function create() {
    this.cameras.main.setBackgroundColor('#12042b');
    
    // Create Platforms
    platforms = this.physics.add.staticGroup();
    let ground = this.add.rectangle(400, 430, 800, 40, 0x00ffff).setStrokeStyle(4, 0xff00ff);
    platforms.add(ground);
    
    let plat1 = this.add.rectangle(600, 300, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    let plat2 = this.add.rectangle(200, 220, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    platforms.add(plat1);
    platforms.add(plat2);

    // Create Super Loaf Dog
    player = this.add.rectangle(100, 300, 50, 35, 0xe69138); 
    this.physics.add.existing(player);
    player.body.setBounce(0.1);
    player.body.setCollideWorldBounds(true);

    // Dynamic Groups
    itemsGroup = this.physics.add.group();
    janitorsGroup = this.physics.add.group();

    // Spawn 2 Future Robot Janitors (Gray Rectangles)
    spawnJanitor.call(this, 300, 380, 120); // Janitor 1 on ground
    spawnJanitor.call(this, 550, 250, -100); // Janitor 2 on high platform

    // Physics Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(itemsGroup, platforms);
    this.physics.add.collider(janitorsGroup, platforms);
    
    // Core Interactions
    this.physics.add.overlap(player, itemsGroup, eatItem, null, this);
    
    // Robots block Super Loaf Dog (solid physical wall)
    this.physics.add.collider(player, janitorsGroup);
    
    // Janitors sweep up the garbage when they roll over it
    this.physics.add.overlap(janitorsGroup, itemsGroup, janitorClean, null, this);

    // UI Score Text
    scoreText = this.add.text(16, 16, 'Score: 0', { 
        fontSize: '24px', 
        fill: '#39ff14',
        fontFamily: 'Courier New' 
    });

    // Time-based Spawner: Slowed down slightly to 2.2 seconds to account for robot cleanup
    this.time.addEvent({
        delay: 2200,
        callback: spawnItem,
        callbackScope: this,
        loop: true
    });

    // Initial item splash
    for (let i = 0; i < 3; i++) {
        spawnItem.call(this);
    }

    // Controls Configuration
    cursors = this.input.keyboard.createCursorKeys();
    
    this.input.on('pointerdown', function (pointer) {
        if (pointer.y < 350 && player.body.touching.down) {
            player.body.setVelocityY(-420);
        }
    });

    // On-screen Mobile Controls
    let leftBtn = this.add.rectangle(70, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(50, 368, 'LEFT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    let rightBtn = this.add.rectangle(730, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(710, 368, 'RIGHT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    leftBtn.on('pointerdown', () => { isMovingLeft = true; });
    leftBtn.on('pointerout', () => { isMovingLeft = false; });
    leftBtn.on('pointerup', () => { isMovingLeft = false; });

    rightBtn.on('pointerdown', () => { isMovingRight = true; });
    rightBtn.on('pointerout', () => { isMovingRight = false; });
    rightBtn.on('pointerup', () => { isMovingRight = false; });
}

// Spawn a patrolling Robot Janitor
function spawnJanitor(x, y, speed) {
    let janitor = this.add.rectangle(x, y, 40, 50, 0x888888).setStrokeStyle(2, 0xcccccc);
    this.physics.add.existing(janitor);
    janitor.body.setCollideWorldBounds(true);
    janitor.body.setVelocityX(speed);
    janitor.body.setBounce(1, 0); // Bounce off walls perfectly horizontally
    janitorsGroup.add(janitor);
}

// Spawns items with custom behaviors based on type
function spawnItem() {
    let xX = Phaser.Math.Between(50, 750);
    let yY = 0;
    let isFood = Phaser.Math.Between(0, 1) === 1;
    let item;

    if (isFood) {
        item = this.add.rectangle(xX, yY, 20, 20, 0x39ff14);
        item.isFood = true;
        
        // 10-Second Expiration Timer for Green Food Squares
        this.time.delayedCall(10000, () => {
            if (item && item.active) {
                // Flash rapidly before blinking out of existence
                this.tweens.add({
                    targets: item,
                    alpha: 0,
                    duration: 200,
                    onComplete: () => { item.destroy(); }
                });
            }
        });
    } else {
        item = this.add.rectangle(xX, yY, 20, 20, 0xff3333);
        item.isFood = false;
    }

    itemsGroup.add(item);
    item.body.setBounceY(Phaser.Math.FloatBetween(0.2, 0.4));
    item.body.setCollideWorldBounds(true);
}

function update() {
    // Player movement
    if (cursors.left.isDown || isMovingLeft) {
        player.body.setVelocityX(-220);
    } else if (cursors.right.isDown || isMovingRight) {
        player.body.setVelocityX(220);
    } else {
        player.body.setVelocityX(0);
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.body.setVelocityY(-420);
    }

    // AI Routine: Turn janitors around if they hit platform edges or slow down
    janitorsGroup.children.iterate((janitor) => {
        if (janitor.body.blocked.left) {
            janitor.body.setVelocityX(120);
        } else if (janitor.body.blocked.right) {
            janitor.body.setVelocityX(-120);
        }
    });
}

// Player Collision Handler
function eatItem(player, item) {
    if (item.isFood) {
        score += 10;
        this.cameras.main.flash(100, 0, 255, 0, 0.2);
    } else {
        score -= 15; // Increased penalty!
        this.cameras.main.shake(150, 0.02);
    }
    item.destroy();
    scoreText.setText('Score: ' + score);
}

// Janitor Collision Handler: Sweeps up garbage safely, ignores food
function janitorClean(janitor, item) {
    if (!item.isFood) {
        // Create a quick shrinking effect to simulate the vacuum intake
        this.tweens.add({
            targets: item,
            scaleX: 0,
            scaleY: 0,
            duration: 100,
            onComplete: () => { item.destroy(); }
        });
    }
}
</script>

</body>
</html>
