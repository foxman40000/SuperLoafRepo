<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Loaf Dog</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b001a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Prevents phone gestures from messing with the game */
            touch-action: none; 
        }
        canvas {
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 600 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);
let player;
let platforms;
let cursors;
let garbage;
let score = 0;
let scoreText;

// Mobile control tracking states
let isMovingLeft = false;
let isMovingRight = false;

function preload() {
    // Standard preload zone for future pixel art
}

function create() {
    // 1. Cyberpunk Grid Background
    this.cameras.main.setBackgroundColor('#12042b');
    
    // 2. Create Platforms
    platforms = this.physics.add.staticGroup();
    let ground = this.add.rectangle(400, 430, 800, 40, 0x00ffff).setStrokeStyle(4, 0xff00ff);
    platforms.add(ground);
    
    let plat1 = this.add.rectangle(600, 300, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    let plat2 = this.add.rectangle(200, 220, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    platforms.add(plat1);
    platforms.add(plat2);

    // 3. Create Super Loaf Dog
    player = this.add.rectangle(100, 300, 50, 35, 0xe69138); 
    this.physics.add.existing(player);
    player.body.setBounce(0.1);
    player.body.setCollideWorldBounds(true);

    // 4. Create Cyber-Garbage
    garbage = this.physics.add.group();
    for (let i = 0; i < 5; i++) {
        let scrap = this.add.rectangle(200 + (i * 120), 100, 20, 20, 0x39ff14);
        garbage.add(scrap);
        scrap.body.setBounceY(Phaser.Math.FloatBetween(0.2, 0.4));
    }

    // 5. Physics Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(garbage, platforms);
    this.physics.add.overlap(player, garbage, eatGarbage, null, this);

    // 6. UI Score Text
    scoreText = this.add.text(16, 16, 'Garbage Eaten: 0', { 
        fontSize: '24px', 
        fill: '#39ff14',
        fontFamily: 'Courier New' 
    });

    // 7. Desktop Keyboard Controls
    cursors = this.input.keyboard.createCursorKeys();
    
    // 8. Mobile Controls Interface
    // Tap the top half of the screen to jump
    this.input.on('pointerdown', function (pointer) {
        // If the tap is anywhere above the bottom controls zone, trigger jump
        if (pointer.y < 350 && player.body.touching.down) {
            player.body.setVelocityY(-420);
        }
    });

    // Visual Virtual D-Pad Buttons at the bottom corners
    // Left Button (Bottom Left Corner)
    let leftBtn = this.add.rectangle(70, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(50, 368, 'LEFT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    // Right Button (Bottom Right Corner)
    let rightBtn = this.add.rectangle(730, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(710, 368, 'RIGHT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    // Touch Event Listeners for Left Button
    leftBtn.on('pointerdown', () => { isMovingLeft = true; });
    leftBtn.on('pointerout', () => { isMovingLeft = false; });
    leftBtn.on('pointerup', () => { isMovingLeft = false; });

    // Touch Event Listeners for Right Button
    rightBtn.on('pointerdown', () => { isMovingRight = true; });
    rightBtn.on('pointerout', () => { isMovingRight = false; });
    rightBtn.on('pointerup', () => { isMovingRight = false; });
}

function update() {
    // Check both Keyboard and On-Screen Button inputs
    if (cursors.left.isDown || isMovingLeft) {
        player.body.setVelocityX(-220);
    } else if (cursors.right.isDown || isMovingRight) {
        player.body.setVelocityX(220);
    } else {
        player.body.setVelocityX(0);
    }

    // Keyboard Jump
    if (cursors.up.isDown && player.body.touching.down) {
        player.body.setVelocityY(-420);
    }
}

function eatGarbage(player, scrap) {
    scrap.destroy();
    score += 1;
    scoreText.setText('Garbage Eaten: ' + score);
    this.cameras.main.shake(100, 0.01);
}
</script>

</body>
</html>
