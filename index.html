<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Loaf Dog</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b001a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        canvas {
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>

<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 600 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);
let player;
let platforms;
let cursors;
let itemsGroup; 
let dronesGroup;
let score = 0;
let scoreText;

let isMovingLeft = false;
let isMovingRight = false;
let isStunned = false; // Prevents input when hit by a drone

function preload() {}

function create() {
    this.cameras.main.setBackgroundColor('#12042b');
    
    // Create Platforms
    platforms = this.physics.add.staticGroup();
    let ground = this.add.rectangle(400, 430, 800, 40, 0x00ffff).setStrokeStyle(4, 0xff00ff);
    platforms.add(ground);
    
    let plat1 = this.add.rectangle(600, 300, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    let plat2 = this.add.rectangle(200, 220, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    platforms.add(plat1);
    platforms.add(plat2);

    // Create Super Loaf Dog
    player = this.add.rectangle(100, 300, 50, 35, 0xe69138); 
    this.physics.add.existing(player);
    player.body.setBounce(0.1);
    player.body.setCollideWorldBounds(true);

    // Groups
    itemsGroup = this.physics.add.group();
    dronesGroup = this.physics.add.group();

    // Spawn Hover Drones (Gray rectangles unaffected by gravity)
    spawnDrone.call(this, 300, 200, 100, 50);
    spawnDrone.call(this, 500, 100, -80, -60);

    // Physics Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(itemsGroup, platforms);
    
    // Core Overlaps
    this.physics.add.overlap(player, itemsGroup, eatItem, null, this);
    
    // Drones overlap with garbage to sweep it up
    this.physics.add.overlap(dronesGroup, itemsGroup, droneClean, null, this);
    
    // Drones overlap player to stun him instead of knocking them off screen
    this.physics.add.overlap(player, dronesGroup, playerHitDrone, null, this);

    // UI Score Text
    scoreText = this.add.text(16, 16, 'Score: 0', { 
        fontSize: '24px', 
        fill: '#39ff14',
        fontFamily: 'Courier New' 
    });

    // Endlessly spawn items every 2.2 seconds
    this.time.addEvent({
        delay: 2200,
        callback: spawnItem,
        callbackScope: this,
        loop: true
    });

    // Initial items
    for (let i = 0; i < 3; i++) {
        spawnItem.call(this);
    }

    // Controls Layout
    cursors = this.input.keyboard.createCursorKeys();
    
    this.input.on('pointerdown', function (pointer) {
        if (!isStunned && pointer.y < 350 && player.body.touching.down) {
            player.body.setVelocityY(-420);
        }
    });

    // Mobile buttons
    let leftBtn = this.add.rectangle(70, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(50, 368, 'LEFT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    let rightBtn = this.add.rectangle(730, 380, 90, 60, 0xff00ff, 0.4).setStrokeStyle(2, 0x00ffff).setInteractive();
    this.add.text(710, 368, 'RIGHT', { fontSize: '18px', fill: '#00ffff', fontFamily: 'Courier New' });

    leftBtn.on('pointerdown', () => { if(!isStunned) isMovingLeft = true; });
    leftBtn.on('pointerout', () => { isMovingLeft = false; });
    leftBtn.on('pointerup', () => { isMovingLeft = false; });

    rightBtn.on('pointerdown', () => { if(!isStunned) isMovingRight = true; });
    rightBtn.on('pointerout', () => { isMovingRight = false; });
    rightBtn.on('pointerup', () => { isMovingRight = false; });
}

// Spawns a drone that flies completely independently of platforms/gravity
function spawnDrone(x, y, speedX, speedY) {
    let drone = this.add.rectangle(x, y, 40, 40, 0x777777).setStrokeStyle(2, 0xaaaaaa);
    this.physics.add.existing(drone);
    
    // Turn off gravity entirely for this object so it hovers
    drone.body.setAllowGravity(false);
    drone.body.setCollideWorldBounds(true);
    
    // Set active velocities
    drone.body.setVelocity(speedX, speedY);
    drone.body.setBounce(1, 1); // Perfect bounce off all screen edges
    
    dronesGroup.add(drone);
}

function spawnItem() {
    let xX = Phaser.Math.Between(50, 750);
    let yY = 0;
    let isFood = Phaser.Math.Between(0, 1) === 1;
    let item;

    if (isFood) {
        item = this.add.rectangle(xX, yY, 20, 20, 0x39ff14);
        item.isFood = true;
        
        this.time.delayedCall(10000, () => {
            if (item && item.active) {
                this.tweens.add({
                    targets: item,
                    alpha: 0,
                    duration: 200,
                    onComplete: () => { item.destroy(); }
                });
            }
        });
    } else {
        item = this.add.rectangle(xX, yY, 20, 20, 0xff3333);
        item.isFood = false;
    }

    itemsGroup.add(item);
    item.body.setBounceY(Phaser.Math.FloatBetween(0.2, 0.4));
    item.body.setCollideWorldBounds(true);
}

function update() {
    if (isStunned) return; // Freeze control updates if stunned

    if (cursors.left.isDown || isMovingLeft) {
        player.body.setVelocityX(-220);
    } else if (cursors.right.isDown || isMovingRight) {
        player.body.setVelocityX(220);
    } else {
        player.body.setVelocityX(0);
    }

    if (cursors.up.isDown && player.body.touching.down) {
        player.body.setVelocityY(-420);
    }
}

function eatItem(player, item) {
    if (item.isFood) {
        score += 10;
        this.cameras.main.flash(100, 0, 255, 0, 0.2);
    } else {
        score -= 15;
        this.cameras.main.shake(150, 0.02);
    }
    item.destroy();
    scoreText.setText('Score: ' + score);
}

// Hover drones absorb the trash cleanly
function droneClean(drone, item) {
    if (!item.isFood) {
        this.tweens.add({
            targets: item,
            scaleX: 0,
            scaleY: 0,
            duration: 100,
            onComplete: () => { item.destroy(); }
        });
    }
}

// Custom handler: Running into a drone stuns Super Loaf Dog instead of pushing the drone away
function playerHitDrone(player, drone) {
    if (isStunned) return; // Prevent overlapping stuns

    isStunned = true;
    isMovingLeft = false;
    isMovingRight = false;
    
    player.body.setVelocity(0, 0); // Freeze Loaf in place
    
    // Quick flashing visual effect to show he is stunned
    let flashTween = this.tweens.add({
        targets: player,
        alpha: 0.3,
        duration: 100,
        yoyo: true,
        repeat: 5
    });

    this.cameras.main.shake(200, 0.01);

    // Release stun after 600 milliseconds
    this.time.delayedCall(600, () => {
        isStunned = false;
        player.alpha = 1;
    });
}
</script>

</body>
</html>
