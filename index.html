<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Loaf Dog</title>
    <!-- Include Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b001a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>

<script>
// Game configuration optimized for a retro mobile layout
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 600 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);
let player;
let platforms;
let cursors;
let garbage;
let score = 0;
let scoreText;

function preload() {
    // In a full game, you would load your 16-bit pixel art here:
    // this.load.image('loaf', 'assets/super_loaf_dog.png');
    
    // Using colored placeholders for this demo template
}

function create() {
    // 1. Futuristic Cyberpunk Grid Background
    this.cameras.main.setBackgroundColor('#12042b');
    
    // 2. Create Platforms (Neon Ledges)
    platforms = this.physics.add.staticGroup();
    
    // Floor
    let ground = this.add.rectangle(400, 430, 800, 40, 0x00ffff).setStrokeStyle(4, 0xff00ff);
    platforms.add(ground);
    
    // Floating neon platforms
    let plat1 = this.add.rectangle(600, 300, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    let plat2 = this.add.rectangle(200, 220, 200, 20, 0x00ffff).setStrokeStyle(2, 0xff00ff);
    platforms.add(plat1);
    platforms.add(plat2);

    // 3. Create Super Loaf Dog (The Hero)
    // Represented by an orange "loaf" rectangle for now
    player = this.add.rectangle(100, 300, 50, 35, 0xe69138); 
    this.physics.add.existing(player);
    player.body.setBounce(0.1);
    player.body.setCollideWorldBounds(true);

    // 4. Create Cyber-Garbage to collect
    garbage = this.physics.add.group();
    for (let i = 0; i < 5; i++) {
        // Green glowing garbage scraps
        let scrap = this.add.rectangle(200 + (i * 120), 100, 20, 20, 0x39ff14);
        garbage.add(scrap);
        scrap.body.setBounceY(Phaser.Math.FloatBetween(0.2, 0.4));
    }

    // 5. Physics Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(garbage, platforms);
    
    // Overlap detection: When Loaf eats garbage
    this.physics.add.overlap(player, garbage, eatGarbage, null, this);

    // 6. UI Score Text
    scoreText = this.add.text(16, 16, 'Garbage Eaten: 0', { 
        fontSize: '24px', 
        fill: '#39ff14',
        fontFamily: 'Courier New' 
    });

    // 7. Controls (Keyboard for testing, touch can be mapped next)
    cursors = this.input.keyboard.createCursorKeys();
    
    // Mobile Touch Input: Tapping the screen makes Loaf jump
    this.input.on('pointerdown', function () {
        if (player.body.touching.down) {
            player.body.setVelocityY(-400);
        }
    });
}

function update() {
    // Left/Right Controls
    if (cursors.left.isDown) {
        player.body.setVelocityX(-200);
    } else if (cursors.right.isDown) {
        player.body.setVelocityX(200);
    } else {
        player.body.setVelocityX(0);
    }

    // Jump Control (Keyboard)
    if (cursors.up.isDown && player.body.touching.down) {
        player.body.setVelocityY(-400);
    }
}

function eatGarbage(player, scrap) {
    scrap.destroy(); // Remove the garbage
    score += 1;
    scoreText.setText('Garbage Eaten: ' + score);
    
    // Snappy screen shake for feedback
    this.cameras.main.shake(100, 0.01);
}
</script>

</body>
</html>
